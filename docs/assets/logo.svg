<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 76" width="100%" height="100%">
  <!-- ISOTIPO SÓLIDO (C + DIAMANTE + V) -->
  <g transform="translate(2, 0)">
    <!-- Arco 'C' (#00E1DF) -->
    <path d="M 42,10 L 20,24 L 20,52 L 42,66" 
          fill="none" 
          stroke="#00E1DF" 
          stroke-width="5.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Diamante Central Tensor con Puntas Redondeadas (#00F5A0) -->
    <rect x="30.5" y="34.5" width="7" height="7" rx="2" ry="2" 
          transform="rotate(45 34 38)" 
          fill="#00F5A0"/>

    <!-- Flecha 'V' Forward (#3390DE) -->
    <path d="M 42,24 L 63,38 L 42,52" 
          fill="none" 
          stroke="#3390DE" 
          stroke-width="5.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>

  <!-- TIPOGRAFÍA CORECV (CENTRADIDAD VERTICAL PERFECTA RESPECTO AL ÍCONO) -->
  <text x="82" y="51" 
        font-family="'Inter', 'Outfit', 'Montserrat', 'Space Grotesk', system-ui, sans-serif" 
        font-weight="900" 
        font-size="42" 
        fill="#0F172A" 
        stroke="#FFFFFF" 
        stroke-width="3" 
        stroke-linejoin="round" 
        paint-order="stroke fill" 
        letter-spacing="-1.5">
    Core<tspan fill="#1AB9DF" stroke="none">CV</tspan>
  </text>
</svg>
