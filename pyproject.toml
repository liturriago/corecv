[project]
name = "corecv"
version = "0.1.0"
description = "CoreCV: Production-ready Computer Vision Library"
authors = [
    { name = "Lucas Iturriago", email = "70216214+liturriago@users.noreply.github.com" },
]
readme = "README.md"
keywords = ["computer-vision", "pytorch", "deep-learning", "onnx", "executorch", "object-detection", "segmentation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/liturriago/corecv"
Documentation = "https://github.com/liturriago/corecv"
Repository = "https://github.com/liturriago/corecv.git"

requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "albumentations>=1.3.0",
    "pyyaml>=6.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "pytest>=7.0.0",
    "mkdocs>=1.5.0",
    "mkdocstrings[python]>=0.24.0",
    "mkdocs-material>=9.0.0",
]

[project.scripts]
corecv = "corecv.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
fixable = ["ALL"]
unfixable = []
select = [
    "D",
    "I",
    "ANN",
    "E",
    "F",
    "W",
    "UP",
    "B",
    "C4",
    "SIM",
    "T20",
    "ARG",
    "PTH",
    "ERA",
    "PL",
    "TRY",
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"src/corecv/config/schemas.py" = ["TRY003"]
"src/corecv/core/contract.py" = ["UP006", "UP035", "PLR0402"]
"src/corecv/cli/main.py" = ["B008", "ERA001", "PLR0913", "E501"]
"tests/*.py" = ["PLR2004", "ANN001", "ANN201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --strict-config"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "gpu: marks tests as GPU-dependent",
]
